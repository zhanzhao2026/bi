# ============================================================
# 语义层 · 维度与时间口径(v14):v13 基础上新增层级维度(§16.2)。
# column 中的表别名 f 与 models.yml(fact_order.alias)对应。
# 层级:category --children--> product(下钻 product 时编译器自动带父类目名列)。
# ============================================================
dims:
  date:      {column: "f.pay_date", desc: 支付日期}
  category:  {column: "f.category_id", name_table: dim_category, name_col: category_name, desc: 商品类目, user_terms: [类目,品类], children: [product]}
  product:   {column: "f.product_id", name_table: dim_product, name_col: product_name, desc: 商品(仅聚合行,可从类目下钻), user_terms: [商品,爆款,产品]}
  channel:   {column: "f.channel_id", name_table: dim_channel, name_col: channel_name, desc: 成交渠道, user_terms: [渠道,直播,私域]}
  user_type: {column: "f.user_type", desc: "用户类型(新客/老客)", user_terms: [新客,老客,新老]}
time_presets: [yesterday, last_7d, last_30d, this_month, last_month]
